name: Migration Replay

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migration-replay.yml"
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialise local Supabase config
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi

      - name: Start empty local Supabase
        run: supabase start

      - name: Replay all migrations from empty database
        run: supabase db reset --local

      - name: Show local migration state
        run: supabase migration list --local
