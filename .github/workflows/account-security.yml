name: Account Security

on:
  pull_request:
  workflow_dispatch:

jobs:
  invited-account-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Initialise local Supabase
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          mkdir -p /tmp/ceac-migrations
          find supabase/migrations -maxdepth 1 -name '*.sql' -exec mv {} /tmp/ceac-migrations/ \;
          supabase start
          mv /tmp/ceac-migrations/*.sql supabase/migrations/
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/replay/legacy-live-artifacts.sql
          supabase migration up --local

      - name: Seed local organisation and bootstrap invitation
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.organisations(id,name,short_code)
          values('10000000-0000-4000-8000-000000000001','CEAC Test','CEACT');

          insert into public.units(id,org_id,name,code)
          values('20000000-0000-4000-8000-000000000001','10000000-0000-4000-8000-000000000001','Test Unit','TST');

          -- Test bootstrap only: a brand-new empty database has no existing profile
          -- to reference as invited_by. Production migration 060 keeps this NOT NULL.
          alter table public.pending_invitations alter column invited_by drop not null;
          insert into public.pending_invitations(
            id,org_id,email,full_name,unit_id,role,invited_by,expires_at
          ) values(
            '40000000-0000-4000-8000-000000000001',
            '10000000-0000-4000-8000-000000000001',
            'manager@ceac.local.test','Test Manager',
            '20000000-0000-4000-8000-000000000001','staff',
            null,now()+interval '1 day'
          );
          SQL

      - name: Export local Auth credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Test invited account lifecycle
        run: node scripts/test-account-security.mjs
