      - name: Upload R3 Administration product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-r3-product-inspection
          path: test-artifacts/redesign-r3-*.png
          if-no-files-found: ignore

      - name: Upload R4 Executive product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesign-r4-product-inspection
          path: test-artifacts/redesign-r4-*.png
          if-no-files-found: ignore

      - name: Upload R5 Communication product inspection
        if: always()
