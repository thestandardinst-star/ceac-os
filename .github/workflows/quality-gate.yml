name: Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  role-and-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start clean local Supabase and replay migrations
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
          mkdir -p /tmp/ceac-migrations
          find supabase/migrations -maxdepth 1 -name '*.sql' -exec mv {} /tmp/ceac-migrations/ \;
          supabase start
          mv /tmp/ceac-migrations/*.sql supabase/migrations/
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/replay/legacy-live-artifacts.sql
          supabase migration up --local

      - name: Seed test organisation
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.organisations(id,name,short_code)
          values('10000000-0000-4000-8000-000000000010','CEAC Quality Test','CEACQ');

          insert into public.units(id,org_id,name,code)
          values
            ('20000000-0000-4000-8000-000000000011','10000000-0000-4000-8000-000000000010','Test Unit A','TSTA'),
            ('20000000-0000-4000-8000-000000000012','10000000-0000-4000-8000-000000000010','Test Unit B','TSTB');

          -- Clean-database test bootstrap only. Production migration 060 keeps this NOT NULL.
          alter table public.pending_invitations alter column invited_by drop not null;
          SQL

      - name: Export local Supabase credentials
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Seed role fixtures
        run: node scripts/seed-role-fixtures.mjs

      - name: Run SQL RLS tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_smoke.sql

      - name: Run Admin & HR security gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/admin_hr_security_gate.sql

      - name: Run Platform Kernel gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/platform_kernel_gate.sql

      - name: Run Meeting authority gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/meeting_authority_gate.sql

      - name: Run Stage 1A employment history gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/employment_history_gate.sql

      - name: Run Stage 1B platform audit gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/platform_audit_gate.sql

      - name: Run Stage 1C capability authority gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/capability_authority_gate.sql

      - name: Run Stage 1D event framework gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/event_framework_gate.sql

      - name: Run Stage 1E workflow engine gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/workflow_engine_gate.sql

      - name: Run Stage 1F policy rules gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/policy_rules_gate.sql

      - name: Run Stage 1G integration gateway gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/integration_gateway_gate.sql

      - name: Run Stage 2 employee lifecycle gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/employee_lifecycle_gate.sql

      - name: Run Stage 3 protected HR gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/protected_hr_stage3_gate.sql

      - name: Run Stage 4 Goals and Strategy gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/goals_strategy_stage4_gate.sql

      - name: Run Stage 5 Work Management 2.0 gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/work_management_stage5_gate.sql

      - name: Run Stage 6 Resource and Workload gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/resource_workload_stage6_gate.sql

      - name: Run Stage 7 Performance and Development gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/performance_development_stage7_gate.sql

      - name: Run Stage 8 Learning gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/learning_stage8_gate.sql

      - name: Run Stage 9 Workforce Management gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/workforce_management_stage9_gate.sql

      - name: Run Stage 10 Assets & Devices gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/assets_devices_stage10_gate.sql

      - name: Run Stage 11 Compliance & Policy gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/compliance_policy_stage11_gate.sql

      - name: Run Experience Stage 5 project register gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/project_register_experience_stage5_gate.sql

      - name: Run Experience Stage 6 finance gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/experience_stage6_finance_gate.sql

      - name: Run Experience Stage 7 work-capture gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/experience_stage7_work_capture_gate.sql

      - name: Run Experience Stage 8 interface gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/experience_stage8_interface_gate.sql

      - name: Run production hardening gate
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/production_hardening_gate.sql

      - name: Install Playwright runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ceac-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ceac-vite.log
          exit 1

      - name: Run Playwright role smoke tests
        run: npx playwright test

      - name: Upload Stage 6 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-product-inspection
          path: test-artifacts/stage6-workload-*.png
          if-no-files-found: ignore

      - name: Upload Stage 7 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-product-inspection
          path: test-artifacts/stage7-performance-*.png
          if-no-files-found: ignore

      - name: Upload Stage 8 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-product-inspection
          path: test-artifacts/stage8-learning-*.png
          if-no-files-found: ignore

      - name: Upload Stage 9 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-product-inspection
          path: test-artifacts/stage9-workforce-*.png
          if-no-files-found: ignore

      - name: Upload Stage 10 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage10-product-inspection
          path: test-artifacts/stage10-assets-*.png
          if-no-files-found: ignore

      - name: Upload Stage 11 product inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage11-product-inspection
          path: test-artifacts/stage11-compliance-*.png
          if-no-files-found: ignore

      - name: Upload laptop density inspection
        if: always()
        uses: actions/upload-artifact@v4
